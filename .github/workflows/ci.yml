name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the coverage-badge step below, and only on push to main
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -v ./...

      # -coverpkg=./... attributes coverage across package boundaries (e.g.
      # pkg/api's tests exercising pkg/catalog's LoadManifestFile) instead of
      # only counting a package's own test file — without it the reported
      # total meaningfully understates real coverage.
      - name: Test
        run: go test -v -race -timeout 10m -coverprofile=cover.out -covermode=atomic -coverpkg=./... ./...

      # Enforces .testcoverage.yml's thresholds as a real CI gate, not just
      # a one-time check — a PR that drops coverage below them fails here.
      # On push to main only, also regenerates and commits the coverage
      # badge to the "badges" branch (README's coverage badge reads from
      # there), matching the convention used across this org's other Go
      # repos (e.g. go-grc, go-cryptoutil).
      - name: Check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

  circuitctl-verify:
    name: circuitctl verify (catalog integrity gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # This is the CI gate that makes hand-editing catalog/manifest.json,
      # swapping an artifact's bytes under an existing id, or leaving an
      # orphaned artifact file impossible to merge (spec §5.3, §5.4).
      - name: circuitctl verify
        run: go run ./cmd/circuitctl verify

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=5m --tests=false

      # Deliberately explicit: go-trust's Makefile chains golangci-lint +
      # gosec + staticcheck, but its own CI workflow only runs
      # golangci-lint, leaving the other two unenforced despite being
      # available (spec Appendix C). Closing that gap here rather than
      # inheriting it, since gosec in particular is the security-relevant
      # check for a service that parses untrusted input over HTTP.
      #
      # No @latest / @version here — both are `tool` dependencies in
      # go.mod (added via `go get -tool`), so the version actually
      # installed is pinned and verified through go.sum like any other
      # dependency, not re-resolved fresh on every CI run.
      - name: Install gosec and staticcheck
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec
          go install honnef.co/go/tools/cmd/staticcheck

      - name: gosec
        run: gosec -exclude=G107 -tests ./...

      - name: staticcheck
        run: staticcheck ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck # pinned via go.mod's tool directive, not @latest
      - run: govulncheck ./...

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t go-zk-circuits:ci .

profile: cover.out
threshold:
  file: 60
  package: 70
  total: 70
exclude:
  paths:
    - ^docs/swagger/ # generated by swag init — not our code to test
override:
  # main() itself is process wiring (parse env, build the server, block on
  # OS signals) — exercised by cmd/zkc's own integration_test.go (a
  # separate real-binary test, not part of this unit-test profile), not
  # meaningfully unit-testable. Everything else in these files (config
  # parsing, server construction, CLI command dispatch) has real tests.
  - threshold: 40
    path: ^cmd/zkc/main\.go$
  - threshold: 70
    path: ^cmd/circuitctl/main\.go$

basePath: /
definitions:
  api.HealthResponse:
    properties:
      status:
        type: string
      timestamp:
        type: string
    type: object
  api.InfoResponse:
    properties:
      catalog:
        type: string
      circuitCount:
        type: integer
      generatedAt:
        type: string
      version:
        type: string
    type: object
  api.Problem:
    properties:
      detail:
        type: string
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  api.ReadinessResponse:
    properties:
      catalogLoaded:
        type: boolean
      circuitCount:
        type: integer
      message:
        type: string
      status:
        type: string
      timestamp:
        type: string
    type: object
  catalog.Artifact:
    properties:
      compression:
        type: string
      hash:
        type: string
      mediaType:
        type: string
      size:
        type: integer
      uncompressed:
        $ref: '#/definitions/catalog.Uncompressed'
      url:
        type: string
    type: object
  catalog.CircuitDescriptor:
    properties:
      aliases:
        items:
          type: string
        type: array
      artifact:
        $ref: '#/definitions/catalog.Artifact'
      deprecatedAt:
        type: string
      docTypes:
        items:
          type: string
        type: array
      id:
        type: string
      notes:
        type: string
      params:
        additionalProperties: {}
        type: object
      published:
        type: boolean
      publishedAt:
        type: string
      source:
        $ref: '#/definitions/catalog.Source'
      status:
        type: string
      system:
        type: string
      systemVersion:
        type: string
    type: object
  catalog.Manifest:
    properties:
      catalog:
        type: string
      circuits:
        items:
          $ref: '#/definitions/catalog.CircuitDescriptor'
        type: array
      generatedAt:
        type: string
      manifestVersion:
        type: integer
      next:
        type: string
    type: object
  catalog.Source:
    properties:
      addedBy:
        type: string
      license:
        type: string
      origin:
        type: string
      originPath:
        type: string
      originRef:
        type: string
      verifiedBy:
        items:
          $ref: '#/definitions/catalog.VerificationRecord'
        type: array
    type: object
  catalog.Uncompressed:
    properties:
      hash:
        type: string
      size:
        type: integer
    type: object
  catalog.VerificationRecord:
    properties:
      date:
        type: string
      notes:
        type: string
      result:
        type: string
      tool:
        type: string
      toolVersion:
        type: string
      verifierIdentity:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: sirosfoundation
    url: https://github.com/sirosfoundation/go-zk-circuits
  description: |-
    Public, read-only catalog and content-addressed file host for
    zero-knowledge-proof circuit artifacts and their metadata.
    See circuit-distribution-service-spec.md for the full contract.

    Every endpoint here MUST be implementable by a dumb static
    file server (spec §3.1) — the hosting decision stays reversible.
  license:
    name: BSD-2-Clause
    url: https://opensource.org/licenses/BSD-2-Clause
  termsOfService: https://github.com/sirosfoundation/go-zk-circuits
  title: go-zk-circuits API
  version: 0.1.0
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Liveness check
      tags:
      - Health
  /info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.InfoResponse'
      summary: Build and catalog info
      tags:
      - Info
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ReadinessResponse'
      summary: Readiness check
      tags:
      - Health
  /v1/artifacts/{alg}/{hex}:
    get:
      parameters:
      - description: hash algorithm, currently only sha256
        in: path
        name: alg
        required: true
        type: string
      - description: lowercase hex digest, 64 chars for sha256
        in: path
        name: hex
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "206":
          description: Partial Content
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Problem'
        "416":
          description: Requested Range Not Satisfiable
          schema:
            $ref: '#/definitions/api.Problem'
      summary: Content-addressed artifact download
      tags:
      - Artifacts
  /v1/circuits:
    get:
      parameters:
      - description: exact match on system
        in: query
        name: system
        type: string
      - description: exact match on systemVersion
        in: query
        name: version
        type: string
      - description: exact match on params.num_attributes
        in: query
        name: numAttributes
        type: string
      - description: membership in docTypes
        in: query
        name: docType
        type: string
      - description: exact match on status; default active; status=all returns everything
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.Manifest'
      summary: Filtered circuit listing (optional convenience endpoint)
      tags:
      - Circuits
  /v1/circuits/{id}.json:
    get:
      parameters:
      - description: circuit id or alias
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CircuitDescriptor'
        "301":
          description: Moved Permanently
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Problem'
      summary: Single circuit descriptor
      tags:
      - Circuits
  /v1/manifest.json:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.Manifest'
        "304":
          description: Not Modified
      summary: Full circuit catalog manifest
      tags:
      - Manifest
schemes:
- http
- https
swagger: "2.0"
tags:
- description: The full circuit catalog
  name: Manifest
- description: Single-entry lookup and optional filtered listing
  name: Circuits
- description: Content-addressed circuit artifact downloads
  name: Artifacts
- description: Liveness and readiness probes
  name: Health

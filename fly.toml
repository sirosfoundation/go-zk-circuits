# Standalone Fly app config — NOT orchestrated through sirosid-dev's
# fly-up/fly-down tooling (circuit-distribution-service-spec.md Appendix C:
# every standalone Go service in this org, go-trust/go-wallet-backend/
# go-tokenauth/go-grc, ships its own fly.toml; sirosid-dev's orchestration is
# specifically for spinning up full demo/test-environment stacks).
#
# Production config. Custom domain: api.circuits.siros.org (spec §9.1).
# `fly certs add api.circuits.siros.org --app zk-circuits` has been run;
# the cert is provisioned but NOT YET VERIFIED — DNS for api.circuits.siros.org
# is not yet pointed at this app (`fly certs check api.circuits.siros.org
# --app zk-circuits` for current status; `fly certs show` for the exact
# A/AAAA records to add). Deployed automatically on tags matching
# v<semver>-release.N (.github/workflows/fly-deploy.yml). The test host
# (fly.test.toml, app zk-circuits-test) deploys on every push to main
# instead. The human-facing site lives at circuits.siros.org, in a
# separate repo (spec §1.6) — it is not this app.

app = "zk-circuits"
primary_region = "arn"

[build]

[env]
  ZKC_BASE_URL = "https://api.circuits.siros.org"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # spec §4.6: a cold start mid-presentation is exactly the latency this service must avoid
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
